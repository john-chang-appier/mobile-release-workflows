# git-cliff config shared by every SDK repo. A repo overrides it with its own cliff.toml.
[changelog]
header = ""
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_preprocessors = [
  # "[MT-1234] feat: x" → "feat: x (MT-1234)", so the conventional-commit parser sees the type first.
  { pattern = '^\[([A-Z][A-Z0-9]+-\d+)\]\s*(.*)$', replace = "${2} (${1})" },
  { pattern = '\b([A-Z][A-Z0-9]+-\d+)\b', replace = "[${1}](https://appier.atlassian.net/browse/${1})" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(chore|ci|build|docs|style|test)", skip = true },
]
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
