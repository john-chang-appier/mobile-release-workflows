name: prepare-release

on:
  workflow_call:
    inputs:
      version:
        description: X.Y.Z (stable; opens the PR to master) or X.Y.Z-rc.N (RC; tags and dispatches release)
        type: string
        required: true
      base:
        description: develop, or hotfix to cut hotfix/X.Y.Z from the latest stable tag; ignored when the branch exists
        type: string
        default: develop
      dry-run:
        description: Print the plan without pushing, tagging, or opening a PR
        type: boolean
        default: true
      release-dry-run:
        description: For an RC, dispatch release with dry-run (a fixture repo sets this; SDK repos leave it false)
        type: boolean
        default: false
      central-repo:
        description: Repository to load release-tool from; match the repository in `uses:`
        type: string
        default: plaxieappier/mobile-release-workflows
      central-ref:
        description: Ref of central-repo to load release-tool from; match the ref in `uses:`
        type: string
        default: v1
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: Private key of the release GitHub App; its App ID is the RELEASE_APP_ID variable
        required: true

# Everything that writes, or reads the private central repo, uses the release App's token:
# GITHUB_TOKEN can't read another private repo, and its pushes and PRs start no workflows.
permissions:
  contents: read

defaults:
  run:
    shell: bash  # an explicit bash shell runs with -eo pipefail

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Scope the App token to this repo and the central repo
        id: scope
        env:
          CENTRAL_REPO: ${{ inputs.central-repo }}
        run: echo "repositories=${GITHUB_REPOSITORY#*/},${CENTRAL_REPO#*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.scope.outputs.repositories }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.central-repo }}
          ref: ${{ inputs.central-ref }}
          path: .release-workflows
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release-tool and git-cliff
        run: pip install ./.release-workflows/release-tool git-cliff==2.14.2

      - name: Prepare release branch
        id: prepare
        env:
          VERSION: ${{ inputs.version }}
          BASE: ${{ inputs.base }}
          DRY_RUN: ${{ inputs.dry-run }}
          CLIFF_CONFIG: .release-workflows/cliff.toml
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          echo ".release-workflows/" >> .git/info/exclude
          bot_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          .release-workflows/scripts/prepare-release.sh

      - name: Open or update the release PR
        if: ${{ !inputs.dry-run && steps.prepare.outputs.prerelease == 'false' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          # The push above already updated an open PR; only open one when there is none.
          if [ -n "$(gh pr list --head "$BRANCH" --base master --state open --json number --jq '.[].number')" ]; then
            echo "Updated the open release PR from ${BRANCH}"
          else
            gh pr create --base master --head "$BRANCH" \
              --title "Release ${VERSION}" \
              --body "Prepared by prepare-release. Merging is QA's sign-off: merge only after QA passed the latest RC. Review the version files and the CHANGELOG section."
          fi

      - name: Dispatch the RC release
        if: ${{ !inputs.dry-run && steps.prepare.outputs.prerelease == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_DRY_RUN: ${{ inputs.release-dry-run }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f dry-run="$RELEASE_DRY_RUN"
          echo "Dispatched release.yml on $TAG"
